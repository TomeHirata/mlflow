app = "mlflow"
primary_region = "nrt"

[build]
  image = "ghcr.io/mlflow/mlflow"

[processes]
  app = "mlflow server --host 0.0.0.0 --port 8080"

[env]
  MLFLOW_HOST = "0.0.0.0"
  MLFLOW_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
