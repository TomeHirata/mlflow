# Render Blueprint — deploy with "New > Blueprint" at https://dashboard.render.com
# Docs: https://docs.render.com/infrastructure-as-code
services:
  - type: web
    name: mlflow
    runtime: docker
    dockerfilePath: deploy/render-neon/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # You'll set this manually to your Neon connection string
      - key: PORT
        value: "10000"
      - key: WORKERS
        value: "1" # Single worker to stay within 512Mi memory limit
      - key: MLFLOW_SQLALCHEMYSTORE_POOLCLASS
        value: NullPool # Recommended for serverless Postgres (Neon)
      - key: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
        value: "false" # Disable Huey job consumers to stay within 512Mi memory limit
      - key: MLFLOW_SERVER_ALLOWED_HOSTS
        value: "*.onrender.com" # Allow Render's domain for host header validation
